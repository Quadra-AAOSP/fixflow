name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/workflows/backend-ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up JDK 21
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Lint (Checkstyle)
        if: needs.changes.outputs.backend == 'true'
        run: ./mvnw -B checkstyle:check

      - name: Test
        if: needs.changes.outputs.backend == 'true'
        run: ./mvnw -B test

      - name: Build
        if: needs.changes.outputs.backend == 'true'
        run: ./mvnw -B package -DskipTests

      - name: Validate local and production Compose contracts
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./docker/Test-Docker.ps1 -ConfigurationOnly

      - name: Docker backend image build
        if: runner.os == 'Linux'
        run: docker build -t fixflow-backend:ci .

      - name: Retain backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.os }}
          path: Backend/target/surefire-reports/
          if-no-files-found: ignore
