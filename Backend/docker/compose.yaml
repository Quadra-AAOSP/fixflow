# Local stack. Pass secrets with --env-file <path> (or ./compose.sh / ./compose.ps1).
# Example: docker compose --env-file /absolute/path/to/docker.env -p fixflow-local up -d --build
services:
  backend:
    image: ${BACKEND_IMAGE:-fixflow-backend:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1}
        DOCKER_LIBRARY: ${DOCKER_LIBRARY:-docker.io/library}
    restart: unless-stopped
    ports:
      - '${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080'
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-fixflow}
      DB_USER: ${DB_USER:-fixflow}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for the isolated Docker database}
      MINIO_ENABLED: 'true'
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-fixflow-photos}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      FIXFLOW_SUPER_ADMIN_EMAIL: ${FIXFLOW_SUPER_ADMIN_EMAIL:?Set FIXFLOW_SUPER_ADMIN_EMAIL}
      FIXFLOW_SUPER_ADMIN_PASSWORD: ${FIXFLOW_SUPER_ADMIN_PASSWORD:?Set FIXFLOW_SUPER_ADMIN_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-12h}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173,http://localhost:8081}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-2}
      OPENROUTER_RETRY_BACKOFF_SECONDS: ${OPENROUTER_RETRY_BACKOFF_SECONDS:-1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-openrouter/free}
      OPENROUTER_CHAT_TIMEOUT_SECONDS: ${OPENROUTER_CHAT_TIMEOUT_SECONDS:-120}
      OPENROUTER_VISION_ENABLED: ${OPENROUTER_VISION_ENABLED:-false}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      OPENROUTER_VISION_FALLBACK_MODEL: ${OPENROUTER_VISION_FALLBACK_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
      OPENROUTER_RANKING_ENABLED: ${OPENROUTER_RANKING_ENABLED:-false}
      OPENROUTER_RANKING_MODEL: ${OPENROUTER_RANKING_MODEL:-openrouter/free}
      OPENROUTER_RANKING_TIMEOUT_SECONDS: ${OPENROUTER_RANKING_TIMEOUT_SECONDS:-15}
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fixflow}
      MYSQL_USER: ${DB_USER:-fixflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate MYSQL_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" --silent --skip-column-names -e "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 30
    logging: *bounded-logs

  minio:
    image: ${MINIO_IMAGE:-netvark/minio:latest}
    command: ['server', '/data', '--console-address', ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    ports:
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_HOST_PORT:-9000}:9000'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', '--max-time', '3', 'http://127.0.0.1:9000/minio/health/ready']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    logging: *bounded-logs

volumes:
  mysql_data:
  minio_data:
