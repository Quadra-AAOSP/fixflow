spring:
  application:
    name: fixflow
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fixflow}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  data:
    rest:
      detection-strategy: annotated
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

fixflow:
  bootstrap:
    super-admin-email: ${FIXFLOW_SUPER_ADMIN_EMAIL:admin@fixflow.local}
    super-admin-password: ${FIXFLOW_SUPER_ADMIN_PASSWORD:changeme}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:fixflow-photos}


server:
  max-http-request-header-size: 64KB
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

logging:
  level:
    org.springframework.security: INFO
