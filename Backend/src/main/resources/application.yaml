spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  application:
    name: fixflow
  config:
    import: optional:file:.env[.properties]
  datasource:
    # MySQL creates the named database when it is absent; the startup SQL below
    # then creates its tables. The configured user needs CREATE DATABASE permission.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fixflow}?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      # schema.sql is kept under db/ rather than Spring Boot's default location.
      # Run it for MySQL as well as embedded databases when the application starts.
      mode: always
      schema-locations: classpath:db/schema.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    store-type: jdbc
    timeout: ${SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: always
  data:
    rest:
      detection-strategy: annotated
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  docker:
    compose:
      enabled: false
      lifecycle-management: start-only
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration
      - org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
      - org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

fixflow:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window: ${RATE_LIMIT_WINDOW:1m}
    authentication: ${RATE_LIMIT_AUTHENTICATION:20}
    writes: ${RATE_LIMIT_WRITES:120}
    ai: ${RATE_LIMIT_AI:10}
    token-bootstrap: ${RATE_LIMIT_TOKEN_BOOTSTRAP:240}
    max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
    session-check-ms: ${WEBSOCKET_SESSION_CHECK_MS:5000}
  seed:
    demo-enabled: ${SEED_DEMO_DATA:false}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  reporting:
    require-site-setup: ${REPORTING_REQUIRE_SITE_SETUP:true}
  technician-terms:
    version: ${TECHNICIAN_TERMS_VERSION:}
    document-url: ${TECHNICIAN_TERMS_DOCUMENT_URL:}
    required: ${TECHNICIAN_TERMS_REQUIRED:false}
  session:
    absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
  bootstrap:
    super-admin-email: ${FIXFLOW_SUPER_ADMIN_EMAIL:admin@fixflow.local}
    super-admin-password: ${FIXFLOW_SUPER_ADMIN_PASSWORD:changeme}
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:fixflow-photos}
  shop:
    currency: ${SHOP_CURRENCY:SGD}
    minor-unit-digits: ${SHOP_MINOR_UNIT_DIGITS:2}
    flat-shipping-minor: ${SHOP_FLAT_SHIPPING_MINOR:500}
    checkout-success-url: ${SHOP_CHECKOUT_SUCCESS_URL:http://localhost:5173/shop}
    checkout-cancel-url: ${SHOP_CHECKOUT_CANCEL_URL:http://localhost:5173/shop}
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

openrouter:
  ranking:
    enabled: ${OPENROUTER_RANKING_ENABLED:false}
    model: ${OPENROUTER_RANKING_MODEL:${OPENROUTER_MODEL:openrouter/free}}
    timeout-seconds: ${OPENROUTER_RANKING_TIMEOUT_SECONDS:15}
  chat:
    model: ${OPENROUTER_CHAT_MODEL:openrouter/free}
    temperature: ${OPENROUTER_CHAT_TEMPERATURE:0.4}
    max-tokens: ${OPENROUTER_CHAT_MAX_TOKENS:700}
  vision:
    enabled: ${OPENROUTER_VISION_ENABLED:false}
    model: ${OPENROUTER_VISION_MODEL:nvidia/nemotron-3.5-super-vl:free}
    fallback-model: ${OPENROUTER_VISION_FALLBACK_MODEL:minimax/minimax-m3.1-flash:free}
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:openrouter/free}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
  timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:30}
  max-retries: ${OPENROUTER_MAX_RETRIES:2}
  retry-backoff-seconds: ${OPENROUTER_RETRY_BACKOFF_SECONDS:1}
  temperature: ${OPENROUTER_TEMPERATURE:0.7}
  max-tokens: ${OPENROUTER_MAX_TOKENS:1000}


server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  max-http-request-header-size: 64KB
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true
        # Default false so the session cookie works over plain HTTP (local dev /
        # mobile on 10.0.2.2 or a LAN IP). A Secure cookie is silently dropped by
        # the client over http, which logged mobile users out on every request.
        # Production/HTTPS should set SESSION_COOKIE_SECURE=true.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
